# PrivateDrop — Shopify app configuration
#
# Ce fichier décrit l'app pour le Shopify CLI et le Partner Dashboard.
# `client_id` et `application_url` sont (re)générés/écrasés automatiquement par :
#   npm run config:link      (shopify app config link)
#   npm run dev              (shopify app dev — met à jour application_url avec le tunnel)
#
# Ne PAS committer un client_id réel d'une app de production.

# Renseigné automatiquement par `shopify app config link`.
client_id = ""

name = "PrivateDrop"
handle = "privatedrop"
application_url = "https://privatedrop-shopify-app.vercel.app"
embedded = true

[build]
# Inclut le store de dev dans les URLs OAuth générées localement.
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# Scope réduit au minimum pour valider l'installation en premier.
# read_products suffit pour le dashboard + futures sélections produit.
# read_customers (règles VIP) sera ajouté plus tard — il demande l'approbation
# "Protected customer data" qui peut bloquer/retarder l'install.
scopes = "read_products"
# OAuth classique (redirection) plutôt que managed install : config 100 % manuelle.
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://privatedrop-shopify-app.vercel.app/auth/callback",
  "https://privatedrop-shopify-app.vercel.app/auth/shopify/callback",
  "https://privatedrop-shopify-app.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  # Désinstallation : marque le shop désinstallé + purge des données.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Mise à jour des scopes accordés.
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks RGPD obligatoires (compliance).
  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

# App Proxy — base posée en M1. La page événement complète arrive en M5.
# Expose nos routes serveur sous le domaine de la boutique :
#   https://<boutique>/apps/privatedrop/...  ->  <app>/proxy/...
[app_proxy]
url = "https://privatedrop-shopify-app.vercel.app/proxy"
prefix = "apps"
subpath = "privatedrop"

[pos]
embedded = false
